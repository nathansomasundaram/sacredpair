<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#fafafc;font-family:Arial,Helvetica,sans-serif;color:#1e2340;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafafc;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #d9d6e6;border-radius:16px;">
            <tr>
              <td style="padding:36px 32px;">
                <p style="margin:0 0 28px;font-family:Georgia,serif;font-size:22px;color:#4a3d8f;">Sacred Pair</p>
                <h1 style="margin:0 0 16px;font-family:Georgia,serif;font-weight:normal;font-size:26px;line-height:1.25;">Confirm your new email</h1>
                <p style="margin:0 0 28px;font-size:17px;line-height:1.6;">You asked to change the email address on your Sacred Pair account. Confirm the change to finish. The link works for one hour.</p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/settings/account" style="display:inline-block;background:#4a3d8f;color:#ffffff;text-decoration:none;font-weight:bold;font-size:17px;padding:14px 28px;border-radius:999px;">Confirm the change</a>
                </p>
                <p style="margin:0;font-size:15px;line-height:1.6;color:#4f5575;">If you didn't ask for this, ignore this email and your address stays the same. Consider changing your password.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
