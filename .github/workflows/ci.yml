name: CI

# Runs on every pull request and on main. Vercel builds and deploys previews
# and production separately through its Git integration.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supabase URLs and keys come from the Supabase that CI starts (see the
# "Export Supabase settings" step); none are written into this file.
env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Database rules and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Database, auth and the local inbox (Mailpit) that tests read emails from.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Export Supabase settings
        run: node scripts/supabase-env.mjs --github-env
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
